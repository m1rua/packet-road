name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read 

concurrency:
  group: cli-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: python checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: check python syntax
        run: python -m py_compile get_info.py

      - name: check code with Ruff
        run: python -m ruff check .

      - name: Test CLI and local HTTP TLS connections
        run: python -m unittest discover -s tests -v
    
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks, ansible-checks, helm-checks, terraform-checks]
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t ghcr.io/m1rua/packet-road:sha-${{ github.sha }} .
      
      - name: log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/m1rua/packet-road:sha-${{ github.sha }}
  
  ansible-checks:
    name: ansible checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: 
      - name: checkout repository 
        uses: actions/checkout@v4
        
      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      
      - name: install ansible
        run: python -m pip install ansible-core ansible-lint

      - name: install ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml 
        
      - name: create test variables
        run: |
          echo 'ghcr_token: "ci-placeholder"' > ansible/vault.yml
      
      - name: syntax check
        run: ansible-playbook -i ansible/inventory.ini ansible/setup.yml --syntax-check

      - name: lint ansible playbook
        run: ansible-lint ansible/setup.yml

  helm-checks:
    name: helm-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download helm
        uses: azure/setup-helm@v4

      - name: checkout chart
        run: helm lint helm/packet-road

      - name: render chart with host network
        run: helm template packet-road helm/packet-road --set hostNetwork=true > /dev/null

      - name: render chart with pod network
        run: helm template packet-road helm/packet-road --set hostNetwork=false > /dev/null

  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Test plans with mocked libvirt
        run: terraform test
