- name: Prepare lab server
  hosts: lab
  become: true

  vars:
    packet_road_image: ghcr.io/m1rua/packet-road:sha-891906fc6da533ea8a4de7130062e4e56e2fadbf
    grafana_image: grafana/grafana:nightly-slim

  vars_files:
    - vault.yml

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Run Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Docker authorization
      community.docker.docker_login:
        registry_url: ghcr.io
        username: m1rua
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Pull packet-road image
      community.docker.docker_image_pull:
        name: "{{ packet_road_image }}"
        pull: not_present

    - name: Download node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Run node exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Install prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present

    - name: Prometheus yaml delivery to VM 
      ansible.builtin.copy:
        src: prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: prometheus
        mode: "0640"
        validate: "/usr/bin/promtool check config %s"
      notify: Restart Prometheus

    - name: Run prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        state: started
        enabled: true

    - name: Create grafana data volume
      community.docker.docker_volume:
        name: grafana_data
        state: present

    - name: Create grafana path on VM
      ansible.builtin.file:
        path: /opt/packet-road/grafana/provisioning/datasources
        state: directory
        owner: root
        group: root
        mode: "0755"
    
    - name: Deliver grafana config to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/datasources/prometheus.yml"
        dest: /opt/packet-road/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    - name: Create provider path on VM
      ansible.builtin.file:
        path: /opt/packet-road/grafana/provisioning/dashboards
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deliver provider to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/dashboards/dashboards.yml"
        dest: /opt/packet-road/grafana/provisioning/dashboards/dashboards.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    - name: Create Grafana dashboards directory
      ansible.builtin.file:
        path: /opt/packet-road/grafana/dashboards
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deliver Grafana dashboards
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/dashboards/"
        dest: /opt/packet-road/grafana/dashboards/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Run grafana
      community.docker.docker_container:
        name: grafana
        image: "{{ grafana_image }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        volumes:
          - grafana_data:/var/lib/grafana
          - /opt/packet-road/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
          - /opt/packet-road/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
          - /opt/packet-road/grafana/dashboards:/var/lib/grafana/dashboards:ro
  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        state: restarted

    - name: Restart Grafana
      community.docker.docker_container:
        name: grafana
        state: started
        restart: true