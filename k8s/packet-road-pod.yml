apiVersion: v1
kind: Pod
metadata:
  name: packet-road
spec:
  # For private GHCR: [{name: ghcr-pull}], with that Secret already created.
  imagePullSecrets: []
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  containers:
    - name: packet-road
      image: ghcr.io/m1rua/packet-road:sha-cdc390842d944bbf913e43102fdcf4ac2f0f11e0
      stdin: true
      tty: true
      securityContext:
        runAsUser: 0
        capabilities:
          drop:
            - ALL
          add:
            - NET_RAW
