apiVersion: v1
kind: Pod
metadata:
  name: packet-road
spec:
  restartPolicy: Never
  containers:
    - name: packet-road
      image: ghcr.io/m1rua/packet-road:sha-3f1a0a54f9a6fb848deb54f95239158d9d6b4803
      stdin: true
      tty: true
      securityContext:
        runAsUser: 0
        capabilities:
          drop:
            - ALL
          add:
            - NET_RAW